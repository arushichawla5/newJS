<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            border: 2px solid black ;
            margin: 20px;
            ;
            /* padding-right: 200px; */
        }
        input,textarea{
            margin: 15px;
            display: flex;
            padding-left: 10px;
        }
        #form,h1{
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>
        Registration Form
    </h1>
    <form action="" id="form">
    
        Name : <input type="text" placeholder="First name" id="name">
        <input type="text" placeholder="Last name">
    
         Mobile Number : <input type="tel" placeholder="Enter your phone number" id="num">
   
     
        Email: <input type="email" name="email" id="email" placeholder="Enter your gmail">
    
    
        Message: <textarea name="msg" id="msg" placeholder="Write your message" rows="5" cols="20"></textarea>
    
   
    <button type="submit" id="form-submit">Submit</button>
    
    </form>
    <script src="form.js"></script>
</body>
</html>
