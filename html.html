<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            border: 2px solid black;
            margin: 20px;
            /* padding-right: 200px; */
        }
        .usr-name,.usr-email,.usr-phoneno,.usr-msg,.submit,h1{
            margin: 10px;
            padding-bottom: 2px;
            gap: 200px;
            /* padding-left:10px; */
        }
    </style>
</head>
<body>
    <h1>
        Registration Form
    </h1>
    <form action="">
    <div class="usr-name">
        Name : <input type="text" placeholder="First name">
        <input type="text" placeholder="Last name">
    </div>
   
    <div class="usr-phoneno">
        Mobile Number : <input type="tel" placeholder="Enter your phone number">
    </div>
    <div class="usr-email">   
        Email: <input type="email" name="email" id="email" placeholder="Enter your gmail">
    </div>
    <div class="usr-msg">
        Message: <textarea name="msg" id="msg" placeholder="Write your message" rows="5" cols="20"></textarea>
    </div>
    <div class="submit">
    <input type="submit">
    </div>
    </form>
</body>
</html>
